---
# Patch Linux servers — designed for Controller Job Template with survey vars
- name: Patch Linux servers
  hosts: linux
  become: true
  serial: "25%"
  max_fail_percentage: 0
  vars:
    patch_report: []

  tasks:
    - name: Update package cache (Debian)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == 'Debian'

    - name: Apply security patches (RedHat)
      ansible.builtin.dnf:
        name: "*"
        state: latest
        security: true
      register: patch_result_rhel
      when:
        - ansible_os_family == 'RedHat'
        - patch_category == 'security'

    - name: Apply all patches (RedHat)
      ansible.builtin.dnf:
        name: "*"
        state: latest
      register: patch_result_rhel_all
      when:
        - ansible_os_family == 'RedHat'
        - patch_category == 'all'

    - name: Apply patches (Debian)
      ansible.builtin.apt:
        upgrade: dist
      register: patch_result_deb
      when: ansible_os_family == 'Debian'

    - name: Reboot if required and enabled
      ansible.builtin.reboot:
        reboot_timeout: "{{ reboot_timeout }}"
      when:
        - reboot_after | bool
        - ansible_os_family in ['RedHat', 'Debian']

    - name: Record patch result
      ansible.builtin.set_fact:
        patch_report:
          hostname: "{{ inventory_hostname }}"
          os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
          category: "{{ patch_category }}"
          rebooted: "{{ reboot_after | bool }}"

    - name: Display patch summary
      ansible.builtin.debug:
        var: patch_report
