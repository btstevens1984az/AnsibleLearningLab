---
# Job Template: "Baseline - All Hosts"
# Inventory: production | Project: this repo | Playbook: playbooks/baseline.yml
- name: Apply common baseline
  hosts: all
  become: true
  roles:
    - role: common
      # Copy roles/ from webserver-project or use requirements.yml

  tasks:
    - name: Baseline complete marker
      ansible.builtin.lineinfile:
        path: /etc/ansible-baseline-applied
        line: "Baseline applied {{ ansible_date_time.iso8601 }}"
        create: true
        mode: '0644'
      changed_when: false
